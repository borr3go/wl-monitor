<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, initial-scale=1">
<title>Löwengasse – Abfahrtsmonitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  html, body {
    width: 960px;
    height: 480px;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
  }
 
  .board {
    width: 960px;
    height: 480px;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
  }
 
  .header {
    background: #c8102e;
    padding: 0 24px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .wl-logo {
    background: white;
    color: #c8102e;
    font-weight: 900;
    font-size: 18px;
    padding: 5px 10px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .stop-name {
    color: white;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.5px;
  }
  .clock {
    color: rgba(255,255,255,0.9);
    font-size: 25px;
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
  }
 
  .col-header {
    display: grid;
    grid-template-columns: 80px 1fr 200px;
    padding: 0 24px;
    height: 30px;
    align-items: center;
    background: #1f1f1f;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
  }
  .col-header span {
    font-size: 12px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .col-header span:last-child { text-align: right; }
 
  .rows {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .row {
    flex: 1;
    display: grid;
    grid-template-columns: 80px 1fr 200px;
    padding: 0 24px;
    align-items: center;
    border-bottom: 1px solid #222;
  }
  .row:last-child { border-bottom: none; }
 
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 36px;
    border-radius: 5px;
    font-size: 22px;
    font-weight: 700;
  }
  .tram  { background: #c8102e; color: white; }
  .bus   { background: #3d7abf; color: white; }
  .metro { background: #6b4fb5; color: white; }
  .night { background: #1e3d6e; color: white; }
 
  .towards {
    color: #e0e0e0;
    font-size: 24px;
    padding-left: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
 
  .cnt-col {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 16px;
  }
  .cnt-main {
    font-size: 54px;
    font-weight: 700;
    line-height: 1;
    font-family: 'Courier New', monospace;
  }
  .cnt-next {
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    opacity: 0.4;
    font-family: 'Courier New', monospace;
  }
  .cnt-unit      { font-size: 14px; color: #555; margin-left: 3px; }
  .cnt-unit-next { font-size: 10px; margin-left: 2px; opacity: 0.6; }
 
  .cnt-now  { color: #ff3333; }
  .cnt-soon { color: #ffaa00; }
  .cnt-ok   { color: #33cc33; }
  .cnt-far  { color: #666; }
 
  .footer {
    background: #111;
    height: 30px;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    border-top: 1px solid #222;
  }
  .status {
    font-size: 11px;
    color: #444;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #33cc33;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
 
  .disruption {
    background: #1e1400;
    border-left: 3px solid #ffaa00;
    padding: 0 24px;
    height: 28px;
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #ffaa00;
    flex-shrink: 0;
  }
 
  .loading-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .loading-logo {
    background: #c8102e;
    color: white;
    font-weight: 900;
    font-size: 32px;
    padding: 10px 20px;
    border-radius: 6px;
    letter-spacing: 1px;
  }
  .loading-text { color: #555; font-size: 15px; letter-spacing: 1px; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #2a2a2a;
    border-top-color: #c8102e;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { padding: 16px 24px; color: #ff6666; background: #1a0000; border-left: 3px solid #c8102e; font-size: 13px; }
</style>
</head>
<body>
 
<div class="board">
  <div class="header">
    <div class="header-left">
      <div class="wl-logo">WL</div>
      <div class="stop-name">Löwengasse</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
 
  <div class="col-header">
    <span>Linie</span>
    <span style="padding-left:16px">Richtung</span>
    <span>Min</span>
  </div>
 
  <div id="rows" class="rows">
    <div class="loading-screen">
      <div class="loading-logo">WL</div>
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Verbinde mit Wiener Linien...</div>
    </div>
  </div>
 
  <div id="disruption-bar" style="display:none" class="disruption"></div>
 
  <div class="footer">
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">Echtzeit · wienerlinien.at</span>
    </div>
    <span style="font-size:11px;color:#333">RBL 171</span>
  </div>
</div>
 
<script>
const RBL    = 171;
const LINES  = ['1', '4A'];
const WL_URL = `https://www.wienerlinien.at/ogd_realtime/monitor?rbl=${RBL}&activateTrafficInfo=stoerungkurz`;
const PROXY  = 'https://corsproxy.io/?url=';
let timer    = null;
function cntClass(n) {
  if (n <= 1)  return 'cnt-now';
  if (n <= 4)  return 'cnt-soon';
  if (n <= 12) return 'cnt-ok';
  return 'cnt-far';
}
function badgeClass(type, name) {
  if (type === 'ptTram')  return 'tram';
  if (type === 'ptMetro') return 'metro';
  if (name && name[0] === 'N') return 'night';
  return 'bus';
}
 
function render(data) {
  const monitors    = data?.data?.monitors || [];
  const disruptions = data?.data?.trafficInfos || [];
  const rowsEl      = document.getElementById('rows');
  const disruptEl   = document.getElementById('disruption-bar');
 
  if (!monitors.length) {
    rowsEl.innerHTML = '<div class="err">Keine Daten verfügbar.</div>';
    return;
  }
 
  const byLine = {};
  monitors.forEach(m => {
    (m.lines || []).forEach(line => {
      if (!LINES.includes(line.name)) return;
      if (!byLine[line.name]) byLine[line.name] = { line, deps: [] };
      (line.departures?.departure || []).forEach(dep => {
        byLine[line.name].deps.push({ cnt: dep.departureTime?.countdown ?? 999 });
      });
    });
  });
  Object.values(byLine).forEach(e => e.deps.sort((a, b) => a.cnt - b.cnt));
 
  let html = '';
  LINES.forEach(name => {
    const entry = byLine[name];
    if (!entry) return;
    const { line, deps } = entry;
    const bc     = badgeClass(line.type, line.name);
    const first  = deps[0];
    const second = deps[1];
 
    const fDisp = !first ? '' : first.cnt <= 0
      ? `<span class="cnt-main cnt-now" style="font-size:36px">jetzt</span>`
      : `<span class="cnt-main ${cntClass(first.cnt)}">${first.cnt}<span class="cnt-unit">min</span></span>`;
 
    const sDisp = !second ? '' : second.cnt <= 0
      ? `<span class="cnt-next cnt-now">jetzt</span>`
      : `<span class="cnt-next ${cntClass(second.cnt)}">${second.cnt}<span class="cnt-unit-next">min</span></span>`;
 
    html += `<div class="row">
      <div><span class="badge ${bc}">${name}</span></div>
      <div class="towards">${line.towards || ''}</div>
      <div class="cnt-col">${fDisp}${sDisp}</div>
    </div>`;
  });
 
  rowsEl.innerHTML = html;
 
  if (disruptions.length) {
    disruptEl.textContent = '⚠ ' + (disruptions[0].title || 'Störung aktiv');
    disruptEl.style.display = 'flex';
  } else {
    disruptEl.style.display = 'none';
  }
}
 
async function load() {
  document.getElementById('dot').style.background = '#ffaa00';
 
  try {
    const resp = await fetch(PROXY + encodeURIComponent(WL_URL));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
 
    if (!data?.data?.monitors?.length) throw new Error('Sin datos');
 
    render(data);
    document.getElementById('status-text').textContent =
      'Aktualisiert ' + new Date().toLocaleTimeString('de-AT');
    document.getElementById('dot').style.background = '#33cc33';
 
  } catch(e) {
    document.getElementById('dot').style.background = '#ff3333';
    document.getElementById('status-text').textContent =
      'Fehler ' + new Date().toLocaleTimeString('de-AT') + ' · ' + e.message.slice(0, 40);
  }
}
 
// refresco cada 30s — setInterval es más fiable que setTimeout recursivo
setInterval(load, 30000);
 
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('de-AT');
}, 1000);
 
load();
</script>
</body>
</html>
